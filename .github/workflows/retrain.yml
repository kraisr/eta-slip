name: Retrain (SSM)

on:
  workflow_dispatch:
  schedule:
    # 4:00 AM EST (winter) = 09:00 UTC
    - cron: "0 9 * * *"

permissions:
  id-token: write   # required for OIDC
  contents: read

jobs:
  retrain:
    runs-on: ubuntu-latest
    environment:
      name: Production
      url: https://etaslip.com/
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Send retrain command to EC2 via SSM
        id: send
        shell: bash
        run: |
          set -euo pipefail

          CMD_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "ETASlip retrain (GitHub Actions)" \
            --parameters commands='["sudo -u ec2-user -H bash -lc '\''/opt/etaslip/bin/retrain.sh'\''"]' \
            --query "Command.CommandId" \
            --output text)

          echo "command_id=$CMD_ID" >> "$GITHUB_OUTPUT"
          echo "SSM CommandId: $CMD_ID"

      - name: Wait for SSM command to finish
        shell: bash
        run: |
          set -euo pipefail
          aws ssm wait command-executed \
            --command-id "${{ steps.send.outputs.command_id }}" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}"
            --delay 10 \
            --max-attempts 120

      - name: Print stdout/stderr (and fail if not Success)
        shell: bash
        run: |
          set -euo pipefail
          aws ssm get-command-invocation \
            --command-id "${{ steps.send.outputs.command_id }}" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --output json | tee invocation.json

          STATUS=$(jq -r '.Status' invocation.json)
          echo "Status: $STATUS"
          if [[ "$STATUS" != "Success" ]]; then
            exit 1
          fi
