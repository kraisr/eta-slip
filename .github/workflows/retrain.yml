name: Retrain (SSM)

on:
  workflow_dispatch:
  schedule:
    # 4:00 AM EST (winter) = 09:00 UTC
    - cron: "0 9 * * *"

jobs:
  retrain:
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Send retrain command (SSM)
        id: send
        shell: bash
        run: |
          set -euo pipefail
          INSTANCE_ID="${{ secrets.EC2_INSTANCE_ID }}"

          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "ETASlip retrain (GitHub Actions)" \
            --parameters commands="cd /opt/ETASlip && bash -lc 'bin/retrain.sh'" \
            --query "Command.CommandId" \
            --output text)

          echo "command_id=$CMD_ID" >> "$GITHUB_OUTPUT"
          echo "SSM CommandId: $CMD_ID"

      - name: Wait for SSM command to finish
        shell: bash
        run: |
          set -euo pipefail
          aws ssm wait command-executed \
            --command-id "${{ steps.send.outputs.command_id }}" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}"

      - name: Print stdout/stderr (and fail if not Success)
        shell: bash
        run: |
          set -euo pipefail
          aws ssm get-command-invocation \
            --command-id "${{ steps.send.outputs.command_id }}" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --output json | tee invocation.json

          STATUS=$(jq -r '.Status' invocation.json)
          echo "Status: $STATUS"
          if [[ "$STATUS" != "Success" ]]; then
            exit 1
          fi
