services:
  dashboard:
    build: .
    image: etaslip:latest
    container_name: etaslip-dashboard
    restart: unless-stopped
    volumes:
      - ./raw:/app/raw
      - ./models:/app/models
    expose:
      - "8501"
    command:
      - poetry
      - run
      - streamlit
      - run
      - app/dashboard.py
      - --server.address=0.0.0.0
      - --server.port=8501

  collector:
    image: etaslip:latest
    container_name: etaslip-collector
    restart: unless-stopped
    volumes:
      - ./raw:/app/raw
    command:
      - sh
      - -c
      - |
        while true; do
          echo "Collecting GTFS-RT snapshot at $(date -Iseconds)"
          poetry run python scripts/collect_once.py --out-root raw/gtfsrt
          sleep 60
        done

  caddy:
    image: caddy:2
    container_name: etaslip-caddy
    restart: unless-stopped
    depends_on:
      - dashboard
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - web

networks:
  web:
    external: true

volumes:
  caddy_data:
  caddy_config: